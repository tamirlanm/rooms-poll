name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint check
        run: echo "Lint passed"

      - name: Build project
        run: echo "Build complete"

      - name: Check README
        run: grep "project" README.md
