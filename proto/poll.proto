syntax = "proto3";

option go_package = "github.com/tamirlanm/rooms-poll/services/poll/gen/pollpb;pollpb";
option csharp_namespace = "PulseRooms.Poll";

package poll;


service PollService {
    rpc CreatePoll(CreatePollRequest) returns (PollResponse);
    rpc GetPoll(GetPollRequest) returns (PollResponse);
    rpc Vote(VoteRequest) returns (PollResponse);
}

message CreatePollRequest{
    string room_id = 1;
    string question = 2;
    repeated string options = 3;
}

message GetPollRequest{
    string poll_id = 1;
}

message VoteRequest{
    string poll_id = 1;
    string option_id = 2;
    string user_id = 3;
}

message PollResponse{
    string id = 1;
    string room = 2;
    string question = 3;
    repeated PollOption options = 4;
    bool closed = 5;
}   

message PollOption{
    string id = 1;
    string text = 2;
    int32 vote_count = 3;
}


